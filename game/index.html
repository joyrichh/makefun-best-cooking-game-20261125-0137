<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153f40">
  <title>Kuali Kilat — Midnight at the Warung</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #102d30; overflow: hidden; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 160vh); height: min(100vh, 62.5vw); background: #143738; outline: none; touch-action: none; }
    #status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="800" aria-label="Kuali Kilat cooking game"></canvas>
  <div id="status" role="status" aria-live="polite">Kuali Kilat. Press Enter or click to start. Move with WASD or arrow keys; E or Space interacts.</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
